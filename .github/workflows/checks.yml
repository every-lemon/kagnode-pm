name: Proxy Manager
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path vendor/core-rust/Cargo.toml
  inventory:
    name: Repository and Core inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/repository_check.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci && npm run check:web && npm run format:check
      - run: pip install ruff==0.14.4
      - run: ruff format --check scripts tests
  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked
  arm:
    name: ARM64 build and unit checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cargo test --locked
      - run: cargo build --release --locked
  browser:
    name: Browser checks (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: cargo build --locked
      - run: pip install playwright==1.64.1
      - run: playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
